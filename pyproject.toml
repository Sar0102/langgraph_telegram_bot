[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lang-graph-telegram-bot"
version = "0.1.0"
description = "Telegram agent built on LangGraph with DDD-inspired architecture."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "chromadb>=1.0.0",
  "elevenlabs>=2.0.0",
  "langchain-community>=0.3.0",
  "langchain-openai>=0.3.0",
  "langchain-chroma>=0.2.0",
  "langchain-text-splitters>=0.3.0",
  "langgraph>=0.6.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "openai>=1.68.0",
  "pillow>=11.0.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.8.0",
  "pypdf>=5.0.0",
  "python-dotenv>=1.0.0",
  "python-telegram-bot>=22.0",
  "tenacity>=9.0.0",
]

[project.scripts]
telegram-agent = "telegram_agent.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_agent"]
